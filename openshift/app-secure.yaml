# Office-environment Spring Boot app with Elasticsearch security configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  application.properties: |
    # Elasticsearch configuration with security
    elasticsearch.url=https://elasticsearch:9200
    elasticsearch.username=elastic
    # Password will come from secret via environment variable

    # Spring Boot Actuator
    management.endpoints.web.exposure.include=health,metrics,prometheus
    management.endpoint.health.show-details=always

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc-app
  labels:
    app: poc-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: poc-app
  template:
    metadata:
      labels:
        app: poc-app
    spec:
      containers:
        - name: app
          image: poc-app:latest
          imagePullPolicy: Always
          env:
            # Elasticsearch with security
            - name: ELASTICSEARCH_URL
              value: "https://elasticsearch:9200"
            - name: ELASTICSEARCH_USERNAME
              value: "elastic"
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
            # SSL Configuration for self-signed certs
            - name: ELASTICSEARCH_VERIFY_SSL
              value: "false"  # For self-signed certs; change to "true" with proper CA
            # JVM settings
            - name: JAVA_OPTS
              value: "-Xmx768m -Xms512m"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/startup
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: "1"
          volumeMounts:
            - name: app-config
              mountPath: /etc/config
              readOnly: true
      volumes:
        - name: app-config
          configMap:
            name: app-config

---
apiVersion: v1
kind: Service
metadata:
  name: poc-app
  labels:
    app: poc-app
spec:
  selector:
    app: poc-app
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
# Optional: Service Monitor for Prometheus monitoring
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: app-monitor
  labels:
    app: poc-app
spec:
  selector:
    matchLabels:
      app: poc-app
  endpoints:
    - port: http
      interval: 30s
      path: /actuator/prometheus
