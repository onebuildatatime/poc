apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc-elasticsearch
  labels:
    app: poc-elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: poc-elasticsearch
  template:
    metadata:
      labels:
        app: poc-elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
          imagePullPolicy: IfNotPresent
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - name: http
              containerPort: 9200
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels:
    app: poc-elasticsearch
spec:
  selector:
    app: poc-elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
