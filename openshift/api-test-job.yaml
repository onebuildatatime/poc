apiVersion: batch/v1
kind: Job
metadata:
  name: api-test
  labels:
    app: api-test
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: api-test
    spec:
      restartPolicy: Never
      containers:
        - name: test
          image: curlimages/curl:8.9.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |
              set -eu

              echo "=== Testing Message Service ==="
              echo "Creating a message through Spring Boot..."
              CREATE_RESPONSE="$(curl -fsS \
                -H 'Content-Type: application/json' \
                -d '{"message":"Hello Rahul"}' \
                http://poc-app:8080/messages)"
              echo "$CREATE_RESPONSE"
              echo "$CREATE_RESPONSE" | grep '"message":"Hello Rahul"'

              echo "Searching through Spring Boot..."
              SEARCH_RESPONSE="$(curl -fsS --get \
                --data-urlencode 'q=Rahul' \
                http://poc-app:8080/messages/search)"
              echo "$SEARCH_RESPONSE"
              echo "$SEARCH_RESPONSE" | grep '"message":"Hello Rahul"'

              echo ""
              echo "=== Testing Data Service ==="
              echo "Seeding sample data to Elasticsearch..."
              SEED_RESPONSE="$(curl -fsS \
                -H 'Content-Type: application/json' \
                -d '{"items":["POC Item 1","POC Item 2","POC Item 3"]}' \
                http://poc-app:8080/data/seed)"
              echo "$SEED_RESPONSE"
              echo "$SEED_RESPONSE" | grep '"inserted":3'

              echo "Getting data count..."
              COUNT_RESPONSE="$(curl -fsS \
                http://poc-app:8080/data/count)"
              echo "$COUNT_RESPONSE"
              echo "$COUNT_RESPONSE" | grep '"count"'

              echo ""
              echo "✅ Spring Boot API test PASSED!"
